name: SUSFS inline-hook probe - JackA1ltman (lihat isi script + uji urutan resmi, TANPA build)

# Taruh di: .github/workflows/susfs-inline-hook-probe.yml
# Workflow ini TIDAK membangun kernel, TIDAK mengubah repo kamu, dan TIDAK
# menebak isi script. Ia cuma: (1) menampilkan isi asli susfs_inline_hook_patches.sh
# supaya bisa dibaca dan diperiksa, (2) mencoba urutan RESMI dari wiki
# JackA1ltman sendiri: hook dulu, baru patch inti -- di runner sementara.

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Opsional: branch/tag/hash LENGKAP source kernel (kosong = branch yang dijalankan)"
        default: ""
      hook_script_url:
        description: "URL RAW susfs_inline_hook_patches.sh"
        default: "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/susfs_inline_hook_patches.sh"
      susfs_patch_url:
        description: "URL RAW susfs_patch_to_4.19.patch (dipakai SETELAH hook, sesuai urutan resmi wiki)"
        default: "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.19.patch"
      bakasu_ref:
        description: "Tag/commit BakaSU. Wiki resmi memakai tag v4.2.0-rc3 (bukan main) saat memasang hook -- dipakai di sini juga"
        default: "v4.2.0-rc3"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.kernel_ref }}
          fetch-depth: 1

      - name: Siapkan BakaSU (pinned, sesuai urutan resmi wiki)
        env:
          BAKASU_REF: ${{ inputs.bakasu_ref }}
        run: |
          set -euo pipefail
          rm -rf KernelSU
          git clone https://github.com/Baka-SU/BakaSU KernelSU
          git -C KernelSU checkout "$BAKASU_REF"
          echo "BakaSU commit: $(git -C KernelSU rev-parse --short HEAD) (ref: $BAKASU_REF)"
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
            [ "$(tail -n1 drivers/Kconfig)" = "endmenu" ] && sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

      - name: Unduh + TAMPILKAN isi susfs_inline_hook_patches.sh (dibaca dulu sebelum dijalankan)
        env:
          HOOK_URL: ${{ inputs.hook_script_url }}
        run: |
          set -euo pipefail
          case "$HOOK_URL" in
            https://*) ;;
            *) echo "::error::hook_script_url harus URL https RAW: '$HOOK_URL'"; exit 1 ;;
          esac
          mkdir -p /tmp/report
          curl -fL --retry 3 -o /tmp/susfs_inline_hook_patches.sh "$HOOK_URL"
          cp /tmp/susfs_inline_hook_patches.sh /tmp/report/susfs_inline_hook_patches.sh
          echo "SHA256 : $(sha256sum /tmp/susfs_inline_hook_patches.sh | cut -d' ' -f1)"
          echo "Ukuran : $(wc -l < /tmp/susfs_inline_hook_patches.sh) baris"
          echo "== ISI LENGKAP SCRIPT (untuk diperiksa, bukan dijalankan buta) =="
          cat -n /tmp/susfs_inline_hook_patches.sh

      - name: Jalankan hook script (SEBELUM patch inti, sesuai urutan resmi)
        run: |
          set +e
          chmod +x /tmp/susfs_inline_hook_patches.sh
          bash /tmp/susfs_inline_hook_patches.sh 2>&1 | tee /tmp/report/hook-script-output.txt
          echo "Hook script exit code: ${PIPESTATUS[0]}"

          echo "== Cek 7 hook BakaSU setelah script dijalankan =="
          : > /tmp/report/hooks-after-script.txt
          for pair in "kernel/sys.c:ksu_handle_setresuid" "fs/exec.c:ksu_handle_execveat" \
                      "fs/open.c:ksu_handle_faccessat" "fs/read_write.c:ksu_handle_sys_read" \
                      "fs/stat.c:ksu_handle_stat" "kernel/reboot.c:ksu_handle_sys_reboot" \
                      "drivers/input/input.c:ksu_handle_input_handle_event"; do
            f="${pair%%:*}"; s="${pair##*:}"
            if grep -q "$s" "$f" 2>/dev/null; then echo "  ADA     $f -> $s"; else echo "  KOSONG  $f -> $s"; fi
          done | tee /tmp/report/hooks-after-script.txt
          exit 0

      - name: Tempel patch inti SUSFS (SETELAH hook, sesuai urutan resmi)
        env:
          PATCH_URL: ${{ inputs.susfs_patch_url }}
        run: |
          set +e
          case "$PATCH_URL" in
            https://*) ;;
            *) echo "::error::susfs_patch_url harus URL https RAW: '$PATCH_URL'"; exit 0 ;;
          esac
          curl -fL --retry 3 -o /tmp/susfs.patch "$PATCH_URL"
          cp /tmp/susfs.patch /tmp/report/susfs.patch
          echo "SHA256 patch inti: $(sha256sum /tmp/susfs.patch | cut -d' ' -f1)"
          patch -p1 --no-backup-if-mismatch < /tmp/susfs.patch | tee /tmp/report/patch.txt
          find . -name '*.rej' -not -path './.git/*' | sort | tee /tmp/report/rej-list.txt
          while read -r f; do echo "-------- $f --------"; cat "$f"; done < /tmp/report/rej-list.txt > /tmp/report/rej-content.txt

          echo "== Cek 7 hook BakaSU SETELAH patch inti juga ditempel (harus tetap ADA, tidak boleh hilang) =="
          : > /tmp/report/hooks-final.txt
          for pair in "kernel/sys.c:ksu_handle_setresuid" "fs/exec.c:ksu_handle_execveat" \
                      "fs/open.c:ksu_handle_faccessat" "fs/read_write.c:ksu_handle_sys_read" \
                      "fs/stat.c:ksu_handle_stat" "kernel/reboot.c:ksu_handle_sys_reboot" \
                      "drivers/input/input.c:ksu_handle_input_handle_event"; do
            f="${pair%%:*}"; s="${pair##*:}"
            if grep -q "$s" "$f" 2>/dev/null; then echo "  ADA     $f -> $s"; else echo "  KOSONG  $f -> $s"; fi
          done | tee /tmp/report/hooks-final.txt

          echo "== Versi SUSFS yang terpasang =="
          grep -rn "SUSFS_VERSION" include/linux/susfs*.h fs/susfs.c 2>/dev/null | tee /tmp/report/version.txt || true

          {
            echo "### Probe inline-hook JackA1ltman"
            echo "- BakaSU: \`${{ inputs.bakasu_ref }}\`"
            echo "- Hook script SHA256: lihat artifact"
            echo "- Patch inti SHA256: \`$(sha256sum /tmp/susfs.patch | cut -d' ' -f1)\`"
            echo ""
            echo "**Hook setelah script (sebelum patch inti):**"; sed 's/^/  /' /tmp/report/hooks-after-script.txt
            echo ""
            echo "**Hook setelah patch inti juga ditempel:**"; sed 's/^/  /' /tmp/report/hooks-final.txt
            echo ""
            if [ -s /tmp/report/rej-list.txt ]; then
              echo "**Hunk patch inti GAGAL:**"; sed 's/^/  - `/; s/$/`/' /tmp/report/rej-list.txt
            else
              echo "**Patch inti tertempel bersih.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload laporan (termasuk isi script apa adanya)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: susfs-inline-hook-probe-report
          path: /tmp/report
          if-no-files-found: ignore
          retention-days: 7
